<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 २ री सेमी इंग्रजी अभ्यास गेम 🌟</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .game-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); width: 100%; max-width: 600px; text-align: center; border: 4px solid #ff9ff3; }
        h2 { color: #5f27cd; font-size: 24px; margin-bottom: 5px; }
        .category-tag { background-color: #ff9f43; color: white; padding: 6px 18px; border-radius: 15px; font-size: 15px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .score-board { font-size: 18px; color: #ff6b6b; font-weight: bold; margin-bottom: 20px; }
        .question-box { background: #f1f2f6; padding: 20px; border-radius: 15px; font-size: 20px; font-weight: bold; color: #2f3542; margin-bottom: 20px; border: 2px dashed #341f97; min-height: 70px; display: flex; align-items: center; justify-content: center; line-height: 1.5; }
        .options-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option-btn { background: #54a0ff; color: white; border: none; padding: 15px; font-size: 17px; font-weight: bold; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 #2e86de; }
        .option-btn:hover { background: #2e86de; }
        .message { font-size: 20px; font-weight: bold; margin-top: 20px; min-height: 35px; }
        .next-btn { margin-top: 20px; background: #10ac84; color: white; padding: 12px 35px; font-size: 18px; border: none; border-radius: 25px; cursor: pointer; display: none; font-weight: bold; }
    </style>
</head>
<body>
<div class="game-card">
    <h2>🏫 २ री सेमी-इंग्रजी अभ्यास गेम 🏫</h2>
    <div id="category" class="category-tag">विषय</div>
    <div class="score-board">मिळालेले स्टार्स: <span id="score">0</span> ⭐</div>
    <div class="question-box" id="question">प्रश्न लोड होत आहे...</div>
    <div class="options-container" id="options"></div>
    <div class="message" id="message"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">पुढचा प्रश्न ➡️</button>
</div>
<script>
    let score = 0; let currentIdx = 0;
    const questions = [
        { c: "📐 Maths - Addition", q: "10 + 5 = ?", o: ["12", "15", "20", "11"], a: "15" },
        { c: "📐 Maths - Addition", q: "20 + 30 = ?", o: ["40", "50", "60", "30"], a: "50" },
        { c: "📐 Maths - Subtraction", q: "15 - 5 = ?", o: ["10", "20", "5", "15"], a: "10" },
        { c: "🔢 Maths - Tables", q: "2 x 5 = ?", o: ["8", "10", "12", "14"], a: "10" },
        { c: "🔢 Maths - Tables", q: "3 x 4 = ?", o: ["12", "15", "9", "16"], a: "12" },
        { c: "🔤 English - Opposites", q: "Opposite word for 'HOT' (गरम):", o: ["Cold (थंड)", "Warm", "Dry", "Ice"], a: "Cold (थंड)" },
        { c: "🔤 English - Opposites", q: "Opposite word for 'UP' (वर):", o: ["In", "Out", "Down (खाली)", "Left"], a: "Down (खाली)" },
        { c: "🔤 English - Rhyming", q: "Rhyming word for 'CAT':", o: ["DOG", "BAT", "PEN", "SUN"], a: "BAT" },
        { c: "🔤 English - Spelling", q: "Correct spelling for 🍎:", o: ["Apel", "Apple", "Aple", "Appel"], a: "Apple" },
        { c: "🦁 Animal Sounds", q: "Which animal says 'Meow Meow'?", o: ["Dog", "Cat", "Cow", "Lion"], a: "Cat" },
        { c: "🧠 General Knowledge", q: "How many days are there in a WEEK?", o: ["5", "7", "6", "10"], a: "7" }
    ];
    function loadQuestion() {
        document.getElementById('message').innerText = "";
        document.getElementById('next-btn').style.display = "none";
        let qData = questions[currentIdx];
        document.getElementById('category').innerText = qData.c;
        document.getElementById('question').innerText = qData.q;
        let optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = "";
        qData.o.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt);
            optionsDiv.appendChild(btn);
        });
    }
    function checkAnswer(selectedBtn, chosenOpt) {
        let correctAns = questions[currentIdx].a;
        let msg = document.getElementById('message');
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        if(chosenOpt === correctAns) {
            score++; document.getElementById('score').innerText = score;
            msg.style.color = "#10ac84"; msg.innerText = "शाब्बास! बरोबर उत्तर 🎉 ⭐";
            selectedBtn.style.background = "#10ac84";
        } else {
            msg.style.color = "#ff6b6b"; msg.innerText = `अरेरे! योग्य उत्तर: ${correctAns} 👍`;
            selectedBtn.style.background = "#ff6b6b";
        }
        document.getElementById('next-btn').style.display = "inline-block";
    }
    function nextQuestion() {
        currentIdx = (currentIdx + 1) % questions.length; // प्रश्न संपल्यावर पुन्हा पहिल्यापासून सुरू होईल (Unlimited लूप)
        loadQuestion();
    }
    loadQuestion();
</script>
</body>
</html>
