<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 २ री सेमी इंग्रजी अभ्यास गेम 🌟</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 600px;
            text-align: center;
            border: 4px solid #ff9ff3;
        }
        h2 { color: #5f27cd; font-size: 24px; margin-bottom: 5px; }
        .category-tag {
            background-color: #ff9f43;
            color: white;
            padding: 6px 18px;
            border-radius: 15px;
            font-size: 15px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
        .score-board { font-size: 18px; color: #ff6b6b; font-weight: bold; margin-bottom: 20px; }
        .question-box {
            background: #f1f2f6;
            padding: 20px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #2f3542;
            margin-bottom: 20px;
            border: 2px dashed #341f97;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.5;
        }
        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .option-btn {
            background: #54a0ff;
            color: white;
            border: none;
            padding: 15px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #2e86de;
        }
        .option-btn:hover { background: #2e86de; }
        .message { font-size: 20px; font-weight: bold; margin-top: 20px; min-height: 35px; }
        .next-btn {
            margin-top: 20px;
            background: #10ac84;
            color: white;
            padding: 12px 35px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            display: none;
            font-weight: bold;
        }
        .restart-btn {
            margin-top: 20px;
            background: #ff6b6b;
            color: white;
            padding: 12px 35px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="game-card">
    <h2>🏫 २ री सेमी-इंग्रजी अभ्यास गेम 🏫</h2>
    <div id="category" class="category-tag">विषय</div>
    <div class="score-board">मिळालेले स्टार्स: <span id="score">0</span> / <span id="total-q">0</span> ⭐</div>
    
    <div class="question-box" id="question">प्रश्न लोड होत आहे...</div>
    
    <div class="options-container" id="options"></div>
    
    <div class="message" id="message"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">पुढचा प्रश्न ➡️</button>
    <button class="restart-btn" id="restart-btn" onclick="restartGame()">पुन्हा खेळा 🔄</button>
</div>

<script>
    const questions = [
        { category: "📐 Maths", q: "Write in figures: Thirty-five (अक्षरी संख्येचे अंकात लेखन करा)", options: ["53", "35", "30", "5"], correct: "35" },
        { category: "📐 Maths", q: "What is the place value of 4 in '42'? ('४२' मध्ये ४ ची स्थानिक किंमत किती?)", options: ["4", "2", "40", "20"], correct: "40" },
        { category: "📐 Maths", q: "Which number comes just BEFORE 70? (७० च्या आधी कोणती संख्या येते?)", options: ["71", "69", "60", "59"], correct: "69" },
        { category: "📐 Maths", q: "Count the Tens in 58: (५८ मध्ये दशक किती आहेत?)", options: ["8 Tens", "5 Tens", "50 Tens", "3 Tens"], correct: "5 Tens" },
        { category: "📐 Maths", q: "12 + 7 = ?", options: ["17", "18", "19", "20"], correct: "19" },
        { category: "📐 Maths", q: "20 + 30 = ?", options: ["40", "50", "60", "32"], correct: "50" },
        { category: "📐 Maths", q: "15 - 6 = ?", options: ["8", "7", "9", "10"], correct: "9" },
        { category: "📐 Maths", q: "48 - 8 = ?", options: ["40", "8", "44", "50"], correct: "40" },
        { category: "🔢 Tables", q: "2 x 8 = ?", options: ["14", "16", "18", "20"], correct: "16" },
        { category: "🔢 Tables", q: "3 x 7 = ?", options: ["21", "24", "18", "27"], correct: "21" },
        { category: "🔢 Tables", q: "4 x 5 = ?", options: ["25", "15", "20", "30"], correct: "20" },
        { category: "🔢 Tables", q: "5 x 6 = ?", options: ["25", "30", "35", "40"], correct: "30" },
        { category: "📐 Shapes", q: "A Triangle has how many corners? (त्रिकोणाला किती कोपरे असतात?)", options: ["4", "2", "3", "0"], correct: "3" },
        { category: "📐 Money", q: "One 10 Rs note + One 5 Rs coin = How many Rupees? (१० ची नोट + ५ चे नाणे = किती रुपये?)", options: ["12 Rs", "15 Rs", "20 Rs", "51 Rs"], correct: "15 Rs" },
        { category: "🔤 English", q: "Which letter is a Capital Letter? (मोठ्या लिपीतील अक्षर कोणते?)", options: ["a", "m", "R", "e"], correct: "R" },
        { category: "🔤 English", q: "Find the rhyming word for 'TOY':", options: ["BOY", "BAG", "TEN", "CAT"], correct: "BOY" },
        { category: "🔤 English", q: "Find the rhyming word for 'KING':", options: ["SONG", "SING", "RING", "LONG"], correct: "RING" },
        { category: "🔤 Opposites", q: "What is the opposite of 'HOT'? (गरम शब्दाचा विरुद्धार्थी शब्द):", options: ["Cold (थंड)", "Warm", "Ice", "Dry"], correct: "Cold (थंड)" },
        { category: "🔤 Opposites", q: "What is the opposite of 'UP'? (वर च्या विरुद्ध):", options: ["Out", "In", "Down (खाली)", "Left"], correct: "Down (खाली)" },
        { category: "🔤 Spelling", q: "Select the correct spelling for 🍌:", options: ["Benana", "Banana", "Bana", "Banana"], correct: "Banana" },
        { category: "🦁 Sounds", q: "Which animal says 'Meow Meow'? (म्याऊ मॅऊ कोण करतो?)", options: ["Dog", "Cat", "Cow", "Lion"], correct: "Cat" },
        { category: "🦁 Sounds", q: "A Dog ________. (कुत्रा कसा ओरडतो?)", options: ["Roars", "Barks (भुंकतो)", "Bleats", "Mews"], correct: "Barks (भुंकतो)" },
        { category: "🦁 Sounds", q: "Which bird says 'Caw Caw'? (काव काव कोण करतो?)", options: ["Sparrow", "Parrot", "Crow", "Peacock"], correct: "Crow" },
        { category: "🧠 GK", q: "How many days are there in a WEEK? (एका आठवड्यात किती दिवस असतात?)", options: ["5 days", "7 days", "12 days", "30 days"], correct: "7 days" },
        { category: "🧠 GK", q: "What is the first month of the year? (वर्षाचा पहिला महिना कोणता?)", options: ["March", "December", "January", "April"], correct: "January" }
    ];

    let currentIdx = 0;
    let score = 0;

    document.getElementById('total-q').innerText = questions.length;

    function loadQuestion() {
        document.getElementById('message').innerText = "";
        document.getElementById('next-btn').style.display = "none";
        
        let qData = questions[currentIdx];
        document.getElementById('category').innerText = qData.category;
        document.getElementById('question').innerText = qData.q;
        
        let optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = "";
        
        qData.options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, chosenOpt) {
        let correctAns = questions[currentIdx].correct;
        let msg = document.getElementById('message');
        
        let allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        if(chosenOpt === correctAns) {
            score++;
            document.getElementById('score').innerText = score;
            msg.style.color = "#10ac84";
            msg.innerText = "शाब्बास! खूप छान, बरोबर उत्तर आहे 🎉 ⭐";
            selectedBtn.style.background = "#10ac84";
        } else {
            msg.style.color = "#ff6b6b";
            msg.innerText = `अरेरे! योग्य उत्तर: ${correctAns} आहे. 👍`;
            selectedBtn.style.background = "#ff6b6b";
        }
        document.getElementById('next-btn').style.display = "inline-block";
    }

    function nextQuestion() {
        currentIdx++;
        if(currentIdx < questions.length) {
            loadQuestion();
        } else {
            document.getElementById('category').style.display = "none";
            document.getElementById('question').innerText = "🎈 अभिनंदन! तू पूर्ण अभ्यास गेम संपवलास! 🎈";
            document.getElementById('options').innerHTML = "";
            document.getElementById('message').innerText = `तुझा एकूण स्कोर: ${score} / ${questions.length} स्टार्स! ⭐`;
            document.getElementById('next-btn').style.display = "none";
            document.getElementById('restart-btn').style.display = "inline-block";
        }
    }

    function restartGame() {
        currentIdx = 0;
        score = 0;
        document.getElementById('score').innerText = score;
        document.getElementById('category').style.display = "inline-block";
        document.getElementById('restart-btn').style.display = "none";
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
