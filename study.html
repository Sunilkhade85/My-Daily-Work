<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏫 Class 2 - Semi-English Balbharti Star Game 🌟</title>
    <style>
        body { font-family: 'Comic Sans MS', sans-serif; background: linear-gradient(135deg, #fff1eb 0%, #ace0f9 100%); margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .game-card { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 15px 30px rgba(0,0,0,0.1); width: 100%; max-width: 620px; text-align: center; border: 5px solid #ff7675; }
        h2 { color: #d63031; font-size: 26px; margin: 5px 0; text-shadow: 1px 1px 2px #ffeaa7; }
        .menu-container { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .menu-btn { background: #fdcb6e; color: #2d3436; border: none; padding: 18px; font-size: 18px; font-weight: bold; border-radius: 20px; cursor: pointer; box-shadow: 0 5px 0 #e17055; transition: 0.2s; }
        .menu-btn:hover { background: #ffeaa7; transform: translateY(-2px); }
        .category-tag { background-color: #6c5ce7; color: white; padding: 6px 20px; border-radius: 20px; font-size: 16px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .score-board { font-size: 20px; color: #e84393; font-weight: bold; margin-bottom: 15px; }
        .question-box { background: #f5f6fa; padding: 25px; border-radius: 20px; font-size: 22px; font-weight: bold; color: #2f3542; margin-bottom: 20px; border: 3px dashed #6c5ce7; line-height: 1.4; }
        .options-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option-btn { background: #74b9ff; color: white; border: none; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 15px; cursor: pointer; box-shadow: 0 4px 0 #0984e3; }
        .option-btn:hover { background: #0984e3; }
        .message { font-size: 22px; font-weight: bold; margin-top: 20px; min-height: 40px; }
        .next-btn, .back-btn { margin-top: 20px; background: #55efc4; color: #2d3436; padding: 12px 35px; font-size: 18px; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 0 #00b894; }
        .back-btn { background: #fab1a0; box-shadow: 0 4px 0 #e17055; margin-right: 10px; }
    </style>
</head>
<body>

<div class="game-card">
    <!-- Home Menu Screen -->
    <div id="home-screen">
        <h2>🏫 Class 2 - Balbharti Semi-English Study Game 📚</h2>
        <p style="font-size: 16px; color: #636e72; font-weight: bold;">Which subject do you want to learn today? Select below 👇</p>
        <div class="menu-container">
            <button class="menu-btn" onclick="startSubject('english')">🔤 My English Book - Let's Speak & Read</button>
            <button class="menu-btn" onclick="startSubject('maths')">📐 Mathematics - Fun with Numbers & Shapes</button>
            <button class="menu-btn" onclick="startSubject('science')">🦁 My Surroundings - Animals & Nature</button>
        </div>
    </div>

    <!-- Play Screen -->
    <div id="game-screen" style="display: none;">
        <div id="category" class="category-tag">Subject</div>
        <div class="score-board">My Stars: <span id="score">0</span> ⭐</div>
        <div class="question-box" id="question">Loading Question...</div>
        <div class="options-container" id="options"></div>
        <div class="message" id="message"></div>
        <button class="back-btn" onclick="goHome()">🏡 Go Back</button>
        <button class="next-btn" id="next-btn" onclick="loadNextQuestion()">Next Question ➡️</button>
    </div>
</div>

<script>
    // Automatic Cache-Buster for Fresh Loading
    if (!window.location.search.includes('v=')) {
        window.location.href = window.location.pathname + '?v=' + Date.now();
    }

    let score = 0;
    let currentSubject = "";
    let currentQIdx = 0;
    let currentQuestions = [];

    // Official Z.P. Class 2 Semi-English Curriculum Data
    const repo = {
        english: [
            { c: "🔤 English - Action Words", q: "Look at the emoji: 🏃‍♂️ <br> What is the boy doing?", o: ["Running", "Sleeping", "Eating", "Crying"], a: "Running" },
            { c: "🔤 English - Let's Speak", q: "When someone gives you a gift, what should you say?", o: ["Thank you", "Sorry", "Welcome", "Excuse me"], a: "Thank you" },
            { c: "🔤 English - Vocabulary", q: "Which animal is the biggest on land?", o: ["Elephant", "Lion", "Rabbit", "Deer"], a: "Elephant" },
            { c: "🔤 English - Rhyming Words", q: "Find the rhyming word for 'FAN':", o: ["MAN", "PIN", "BOY", "DOG"], a: "MAN" },
            { c: "🔤 English - Opposites", q: "What is the opposite word for 'HAPPY'?", o: ["Sad", "Good", "Smile", "Angry"], a: "Sad" }
        ],
        maths: [
            { c: "📐 Mathematics - Weights", q: "Which object is HEAVIER? <br> 🎈 Balloon or 🍉 Watermelon?", o: ["Watermelon", "Balloon", "Both are equal", "None"], a: "Watermelon" },
            { c: "📐 Mathematics - Shapes", q: "Look at a Coin (नाणे). What is its shape?", o: ["Circle", "Square", "Triangle", "Rectangle"], a: "Circle" },
            { c: "📐 Mathematics - Place Value", q: "What is the expanded form of the number '45'?", o: ["40 + 5", "4 + 5", "50 + 4", "40 + 50"], a: "40 + 5" },
            { c: "📐 Mathematics - Patterns", q: "Complete the number pattern: <br> 5, 10, 15, 20, ___", o: ["25", "21", "30", "22"], a: "25" },
            { c: "📐 Mathematics - Numbers", q: "Write in figures (अंकात लिहा): <br> 'Sixty-two'", o: ["62", "26", "60", "20"], a: "62" }
        ],
        science: [
            { c: "🦁 Surroundings - Animal Homes", q: "Where does a HORSE live?", o: ["Stable", "Shed", "Den", "Nest"], a: "Stable" },
            { c: "🐶 Surroundings - Baby Animals", q: "What is the baby of a CAT called?", o: ["Kitten", "Puppy", "Calf", "Cub"], a: "Kitten" },
            { c: "🌱 Surroundings - Plants", q: "Which part of the plant stays under the ground?", o: ["Roots", "Leaves", "Flowers", "Stem"], a: "Roots" },
            { c: "🐦 Surroundings - Birds", q: "Which bird has beautiful green feathers and can dance?", o: ["Peacock", "Crow", "Sparrow", "Duck"], a: "Peacock" }
        ]
    };

    function startSubject(sub) {
        currentSubject = sub;
        currentQIdx = 0;
        // Shuffle questions to make it unlimited and random every time
        currentQuestions = [...repo[sub]].sort(() => Math.random() - 0.5);
        
        document.getElementById('home-screen').style.display = "none";
        document.getElementById('game-screen').style.display = "block";
        showQuestion();
    }

    function showQuestion() {
        document.getElementById('message').innerText = "";
        document.getElementById('next-btn').style.display = "none";
        
        let qData = currentQuestions[currentQIdx];
        document.getElementById('category').innerText = qData.c;
        document.getElementById('question').innerHTML = qData.q;
        
        let optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = "";
        
        // Shuffle options for better interactive test
        let shuffledOptions = [...qData.o].sort(() => Math.random() - 0.5);
        
        shuffledOptions.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, qData.a);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, chosenOpt, correctAns) {
        let msg = document.getElementById('message');
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

        if(chosenOpt === correctAns) {
            score++; 
            document.getElementById('score').innerText = score;
            msg.style.color = "#00b894"; 
            msg.innerText = "Excellent! You got 1 Star! 🎉 🌟";
            selectedBtn.style.background = "#00b894";
        } else {
            msg.style.color = "#d63031"; 
            msg.innerText = `Oops! Correct Answer is: ${correctAns} 👍`;
            selectedBtn.style.background = "#d63031";
        }
        document.getElementById('next-btn').style.display = "inline-block";
    }

    function loadNextQuestion() {
        currentQIdx++;
        if(currentQIdx < currentQuestions.length) {
            showQuestion();
        } else {
            // Loop questions infinitely by reshuffling
            currentQIdx = 0;
            currentQuestions = [...repo[currentSubject]].sort(() => Math.random() - 0.5);
            showQuestion();
        }
    }

    function goHome() {
        document.getElementById('home-screen').style.display = "block";
        document.getElementById('game-screen').style.display = "none";
    }
</script>
</body>
</html>
