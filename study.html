<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 २ री सेमी इंग्रजी अनलिमिटेड अभ्यास गेम 🌟</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 600px;
            text-align: center;
            border: 4px solid #ff9ff3;
        }
        h2 { color: #5f27cd; font-size: 24px; margin-bottom: 5px; }
        .category-tag {
            background-color: #ff9f43;
            color: white;
            padding: 6px 18px;
            border-radius: 15px;
            font-size: 15px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
        .score-board { font-size: 18px; color: #ff6b6b; font-weight: bold; margin-bottom: 20px; }
        .question-box {
            background: #f1f2f6;
            padding: 20px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #2f3542;
            margin-bottom: 20px;
            border: 2px dashed #341f97;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.5;
        }
        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .option-btn {
            background: #54a0ff;
            color: white;
            border: none;
            padding: 15px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #2e86de;
        }
        .option-btn:hover { background: #2e86de; }
        .message { font-size: 20px; font-weight: bold; margin-top: 20px; min-height: 35px; }
        .next-btn {
            margin-top: 20px;
            background: #10ac84;
            color: white;
            padding: 12px 35px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="game-card">
    <h2>🏫 २ री सेमी-इंग्रजी अभ्यास गेम (अनलिमिटेड) 🏫</h2>
    <div id="category" class="category-tag">विषय</div>
    <div class="score-board">मिळालेले स्टार्स: <span id="score">0</span> ⭐</div>
    
    <div class="question-box" id="question">प्रश्न लोड होत आहे...</div>
    
    <div class="options-container" id="options"></div>
    
    <div class="message" id="message"></div>
    <button class="next-btn" id="next-btn" onclick="generateDynamicQuestion()">पुढचा प्रश्न ➡️</button>
</div>

<script>
    let score = 0;
    let currentCorrectAnswer = "";

    const staticQuestions = [
        { category: "🔤 English - Opposites", q: "What is the opposite of 'HOT'? (गरम शब्दाचा विरुद्धार्थी शब्द):", options: ["Cold (थंड)", "Warm", "Ice", "Dry"], correct: "Cold (थंड)" },
        { category: "🔤 English - Opposites", q: "What is the opposite of 'UP'? (वर च्या विरुद्ध):", options: ["Out", "In", "Down (खाली)", "Left"], correct: "Down (खाली)" },
        { category: "🔤 English - Opposites", q: "What is the opposite of 'BIG'? (मोठ्या शब्दाचा विरुद्ध):", options: ["Tall", "Small (लहान)", "Short", "Fat"], correct: "Small (लहान)" },
        { category: "🔤 English - Rhyming Words", q: "Find the rhyming word for 'TOY':", options: ["BOY", "BAG", "TEN", "CAT"], correct: "BOY" },
        { category: "🔤 English - Rhyming Words", q: "Find the rhyming word for 'KING':", options: ["SONG", "SING", "RING", "LONG"], correct: "RING" },
        { category: "🔤 English - Spelling", q: "Select the correct spelling for 🍌:", options: ["Benana", "Banana", "Bana", "Banan"], correct: "Banana" },
        { category: "🔤 English - Spelling", q: "Select the correct spelling for 🍎:", options: ["Apel", "Apple", "Aple", "Appel"], correct: "Apple" },
        { category: "🦁 Sounds", q: "Which animal says 'Meow Meow'? (म्याऊ मॅऊ कोण करतो?)", options: ["Dog", "Cat", "Cow", "Lion"], correct: "Cat" },
        { category: "🦁 Sounds", q: "A Dog ________. (कुत्रा कसा ओरडतो?)", options: ["Roars", "Barks (भुंकतो)", "Bleats", "Mews"], correct: "Barks (भुंकतो)" },
        { category: "🦁 Sounds", q: "Which bird says 'Caw Caw'? (काव काव कोण करतो?)", options: ["Sparrow", "Parrot", "Crow", "Peacock"], correct: "Crow" },
        { category: "📐 Shapes", q: "A Triangle has how many corners? (त्रिकोणाला किती कोपरे असतात?)", options: ["4", "2", "3", "0"], correct: "3" },
        { category: "📐 Shapes", q: "What is the shape of a BANGLE? (बांगडीचा आकार कसा असतो?)", options: ["Square", "Circle (गोल)", "Triangle", "Rectangle"], correct: "Circle (गोल)" },
        { category: "🧠 General Knowledge", q: "How many days are there in a WEEK? (एका आठवड्यात किती दिवस असतात?)", options: ["5 days", "7 days", "12 days", "30 days"], correct: "7 days" },
        { category: "🧠 General Knowledge", q: "What is the first month of the year? (वर्षाचा पहिला महिना कोणता?)", options: ["March", "December", "January", "April"], correct: "January" }
    ];

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function generateDynamicQuestion() {
        document.getElementById('message').innerText = "";
        document.getElementById('next-btn').style.display = "none";
        
        const qTypes = ["addition", "subtraction", "table", "placeValue", "static"];
        const chosenType = qTypes[Math.floor(Math.random() * qTypes.length)];
        
        let category = "";
        let qText = "";
        let options = [];
        let correct = "";

        if (chosenType === "addition") {
            category = "📐 Maths - Addition";
            let num1 = Math.floor(Math.random() * 50) + 1;
            let num2 = Math.floor(Math.random() * 40) + 1;
            correct = (num1 + num2).toString();
            qText = `${num1} + ${num2} = ?`;
            options = [correct, (num1+num2+2).toString(), (num1+num2-3).toString(), (num1+num2+10).toString()];

        } else if (chosenType === "subtraction") {
            category = "📐 Maths - Subtraction";
            let num1 = Math.floor(Math.random() * 50) + 20; 
            let num2 = Math.floor(Math.random() * 19) + 1;
            correct = (num1 - num2).toString();
            qText = `${num1} - ${num2} = ?`;
            options = [correct, (num1-num2+1).toString(), (num1-num2-2).toString(), (num1-num2+5).toString()];

        } else if (chosenType === "table") {
            category = "🔢 Maths - Tables";
            let num1 = Math.floor(Math.random() * 8) + 2; // 2 ते 9 चे पाढे
            let num2 = Math.floor(Math.random() * 10) + 1;
            correct = (num1 * num2).toString();
            qText = `${num1} x ${num2} = ?`;
            options = [correct, (num1*num2+num1).toString(), (num1*num2-2).toString(), (num1*num2+5).toString()];

        } else if (chosenType === "placeValue") {
            category = "📐 Maths - Place Value";
            let num = Math.floor(Math.random() * 89) + 10;
            let tens = Math.floor(num / 10).toString();
            let units = (num % 10).toString();
            let askTens = Math.random() > 0.5;
            
            if (askTens) {
                correct = tens;
                qText = `Count the Tens in ${num}: (${num} मध्ये दशक किती आहेत?)`;
                options = [correct, (parseInt(tens)+1).toString(), (parseInt(tens)+2).toString(), "0"];
            } else {
                correct = units;
                qText = `Count the Units in ${num}: (${num} मध्ये एकक किती आहेत?)`;
                options = [correct, (parseInt(units)+1).toString(), (parseInt(units)+2).toString(), "9"];
            }

        } else {
            let randomStatic = staticQuestions[Math.floor(Math.random() * staticQuestions.length)];
            category = randomStatic.category;
            qText = randomStatic.q;
            correct = randomStatic.correct;
            options = [...randomStatic.options];
        }

        options = Array.from(new Set(options));
        while(options.length < 4) {
            options.push((Math.floor(Math.random() * 100)).toString());
        }
        shuffle(options);

        currentCorrectAnswer = correct;

        document.getElementById('category').innerText = category;
        document.getElementById('question').innerText = qText;
        
        let optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = "";
        
        options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, chosenOpt) {
        let msg = document.getElementById('message');
        let allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        if(chosenOpt === currentCorrectAnswer) {
            score++;
            document.getElementById('score').innerText = score;
            msg.style.color = "#10ac84";
            msg.innerText = "शाब्बास! खूप छान, बरोबर उत्तर आहे 🎉 ⭐";
            selectedBtn.style.background = "#10ac84";
        } else {
            msg.style.color = "#ff6b6b";
