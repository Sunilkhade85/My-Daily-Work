<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏫 Class 2 - Navneet Master Game 🌟</title>
    <style>
        body { font-family: 'Comic Sans MS', sans-serif; background: linear-gradient(135deg, #fff1eb 0%, #ace0f9 100%); margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .game-card { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 15px 30px rgba(0,0,0,0.1); width: 100%; max-width: 650px; text-align: center; border: 5px solid #ff7675; }
        h2 { color: #d63031; font-size: 26px; margin: 5px 0; text-shadow: 1px 1px 2px #ffeaa7; }
        .menu-container { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .menu-btn { background: #fdcb6e; color: #2d3436; border: none; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 20px; cursor: pointer; box-shadow: 0 5px 0 #e17055; text-align: left; padding-left: 25px; }
        .menu-btn:hover { background: #ffeaa7; }
        .category-tag { background-color: #6c5ce7; color: white; padding: 6px 20px; border-radius: 20px; font-size: 15px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .score-board { font-size: 20px; color: #e84393; font-weight: bold; margin-bottom: 15px; }
        .question-box { background: #f5f6fa; padding: 25px; border-radius: 20px; font-size: 22px; font-weight: bold; color: #2f3542; margin-bottom: 20px; border: 3px dashed #6c5ce7; line-height: 1.5; }
        .options-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option-btn { background: #74b9ff; color: white; border: none; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 15px; cursor: pointer; box-shadow: 0 4px 0 #0984e3; }
        .option-btn:hover { background: #0984e3; }
        .message { font-size: 22px; font-weight: bold; margin-top: 20px; min-height: 40px; }
        .next-btn, .back-btn { margin-top: 20px; background: #55efc4; color: #2d3436; padding: 12px 35px; font-size: 18px; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 0 #00b894; }
        .back-btn { background: #fab1a0; box-shadow: 0 4px 0 #e17055; margin-right: 10px; }
    </style>
</head>
<body>

<div class="game-card">
    <!-- Home Menu Screen -->
    <div id="home-screen">
        <h2>🏫 Navneet Smart Workbooks - Full Syllabus 📚</h2>
        <p style="font-size: 16px; color: #636e72; font-weight: bold;">Select your textbook to start the full test 👇</p>
        <div class="menu-container">
            <button class="menu-btn" style="background: #ff7675; color: white; box-shadow: 0 5px 0 #c0392b;" onclick="startSubject('marathi')">📖 मराठी बालभारती व्यवसाय (सर्व भाग १ ते ४)</button>
            <button class="menu-btn" style="background: #54a0ff; color: white; box-shadow: 0 5px 0 #2e86de;" onclick="startSubject('english')">🔤 My English Workbook (All Units 1 to 4)</button>
            <button class="menu-btn" style="background: #2ecc71; color: white; box-shadow: 0 5px 0 #27ae60;" onclick="startSubject('maths')">📐 Mathematics Workbook (All Chapters)</button>
        </div>
    </div>

    <!-- Play Screen -->
    <div id="game-screen" style="display: none;">
        <div id="category" class="category-tag">Subject</div>
        <div class="score-board">My Stars: <span id="score">0</span> ⭐</div>
        <div class="question-box" id="question">Loading...</div>
        <div class="options-container" id="options"></div>
        <div class="message" id="message"></div>
        <button class="back-btn" onclick="goHome()">🏡 Main Menu</button>
        <button class="next-btn" id="next-btn" onclick="loadNextQuestion()">Next Question ➡️</button>
    </div>
</div>

<script>
    let score = 0;
    let currentSubject = "";
    let currentQIdx = 0;
    let currentQuestions = [];

    const repo = {
        marathi: [
            { c: "📖 पाऊस (कविता)", q: "पाऊस आल्यावर डराव डराव असा आवाज कोण करतो?", o: ["बेडूक", "मुलगा", "चिमणी", "मांजर"], a: "बेडूक" },
            { c: "📖 अशी झाली फजिती...", q: "ऊस खाताना कोणाची फजिती झाली होती?", o: ["भोलोबा अस्वल", "ससा", "कासव", "सिंह"], a: "भोलोबा अस्वल" },
            { c: "📖 भाज्यांची शाळा", q: "भाज्यांची शाळा या कवितेत कोणाला चीड आली?", o: ["मिरच्यांना", "बटाट्याला", "टोमॅटोला", "वांग्याला"], a: "मिरच्यांना" },
            { c: "📖 कबुतर आणि मुंगी", q: "कबुतराने मुंगीचे प्राण वाचवण्यासाठी पाण्यात काय टाकले?", o: ["पान", "दगड", "दोरी", "काठी"], a: "पान" },
            { c: "📖 बैलजोडी (कविता)", q: "बैलजोडी सणाच्या दिवशी बैलांना काय करतात?", o: ["सजवतात", "कामावर नेतात", "झोपवतात", "मारतात"], a: "सजवतात" },
            { c: "📖 अदितीचे साहस", q: "अदितीला रात्रीच्या वेळी चमकणारा कोणता कीटक दिसला?", o: ["काजवा", "मुंगी", "बेडूक", "मधुमाशी"], a: "काजवा" },
            { c: "📖 मासा (कविता)", q: "मासा पाण्यात कसा पोहतो?", o: ["मस्त सळसळ", "पळत", "उड्या मारत", "हळूहळू"], a: "मस्त सळसळ" },
            { c: "📖 आपले वाचनालय", q: "वाचनालयात आपण काय वाचायला जातो?", o: ["पुस्तके", "मोबाईल", "टीव्ही", "खेळ"], a: "पुस्तke" },
            { c: "📖 कोल्हा आणि करकोचा", q: "कोल्ह्याने करकोच्याला जेवायला कशात दिले होते?", o: ["पसरट थाळीत", "लांब भांड्यात", "ग्लासात", "चमच्यात"], a: "पसरट थाळीत" },
            { c: "📖 हत्तीचे गर्वहरण", q: "हत्तीचा गर्व कोणी उतरवला?", o: ["बेडूक", "सिंहाने", "वाघाने", "शिकारीने"], a: "बेडूक" }
        ],
        english: [
            { c: "🔤 Welcome to School", q: "How should we say hello to our friends?", o: ["With a smile", "Say Sorry", "Cry loudly", "Sit quietly"], a: "With a smile" },
            { c: "🔤 Fruit Salad", q: "Which fruit is sweet, red in color, and used in fruit salad?", o: ["Apple", "Lemon", "Onion", "Potato"], a: "Apple" },
            { c: "🔤 It's Raining...", q: "What do we use when 'It's Raining' outside?", o: ["Umbrella", "Sweater", "Cap", "Fan"], a: "Umbrella" },
            { c: "🔤 In the Park", q: "What fun activity do children do on a slide 'In the Park'?", o: ["Sliding down", "Sleeping", "Writing", "Cooking"], a: "Sliding down" },
            { c: "🔤 Our Calendar", q: "According to 'Our Calendar', how many days are there in a week?", o: ["7 days", "12 days", "30 days", "5 days"], a: "7 days" },
            { c: "🔤 Clock and Me", q: "What does the clock tell us?", o: ["Time", "Weather", "Weight", "Money"], a: "Time" },
            { c: "🔤 Good Habits", q: "Which one is a GOOD habit?", o: ["Brushing teeth twice", "Waking up late", "Throwing trash", "Biting nails"], a: "Brushing teeth twice" },
            { c: "🔤 Five Senses", q: "Which body part do we use to TASTE yummy food?", o: ["Tongue", "Eyes", "Ears", "Nose"], a: "Tongue" },
            { c: "🔤 Magic Words", q: "When you want something from someone, which magic word do you use?", o: ["Please", "Sorry", "Thank you", "Welcome"], a: "Please" },
            { c: "🔤 Mother Duck", q: "Who goes quack, quack, quack?", o: ["Mother Duck", "Hen", "Crow", "Sparrow"], a: "Mother Duck" }
        ],
        maths: [
            { c: "📐 Geometrical Shapes", q: "Look at the shape of a brick (वीट). What shape is it?", o: ["Cuboid", "Cone", "Cylinder", "Sphere"], a: "Cuboid" },
            { c: "📐 Number Names", q: "What is the number name for '75'?", o: ["Seventy-five", "Fifty-seven", "Seventy", "Fifty"], a: "Seventy-five" },
            { c: "📐 Units and Tens", q: "The number '36' has how many Tens?", o: ["3 Tens", "6 Tens", "30 Tens", "0 Tens"], a: "3 Tens" },
            { c: "📐 Place Value", q: "What is the PLACE value of 5 in the number '52'?", o: ["50", "2", "5", "20"], a: "50" },
            { c: "📐 Comparing Numbers", q: "Which number is bigger: 48 or 84?", o: ["84", "48", "Both", "None"], a: "84" },
            { c: "📐 Counting in Steps", q: "2, 4, 6, 8, 10... These are steps of which number?", o: ["Steps of 2", "Steps of 3", "Steps of 5", "Steps of 10"], a: "Steps of 2" },
            { c: "📐 Addition", q: "35 + 12 = ?", o: ["47", "37", "45", "57"], a: "47" },
            { c: "📐 Subtraction", q: "48 - 15 = ?", o: ["33", "35", "23", "43"], a: "33" },
            { c: "📐 Multiplication", q: "3 x 5 = ?", o: ["15", "12", "18", "20"], a: "15" },
            { c: "📐 Measurements", q: "We measure the length of a cloth in which unit?", o: ["Metre", "Litre", "Kilogram", "Rupees"], a: "Metre" },
            { c: "📐 Shapes - Part 2", q: "A Joker's cap or an Ice-cream cone has which shape?", o: ["Cone", "Cuboid", "Circle", "Cylinder"], a: "Cone" },
            { c: "📐 Carry-over Addition", q: "28 + 14 = ?", o: ["42", "32", "44", "38"], a: "42" }
        ]
    };

    function startSubject(sub) {
        currentSubject = sub;
        currentQIdx = 0;
        currentQuestions = [...repo[sub]].sort(() => Math.random() - 0.5);
        document.getElementById('home-screen').style.display = "none";
        document.getElementById('game-screen').style.display = "block";
        showQuestion();
    }

    function showQuestion() {
        document.getElementById('message').innerText = "";
        document.getElementById('next-btn').style.display = "none";
        let qData = currentQuestions[currentQIdx];
        document.getElementById('category').innerText = qData.c;
        document.getElementById('question').innerHTML = qData.q;
        let optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = "";
        let shuffledOptions = [...qData.o].sort(() => Math.random() - 0.5);
        shuffledOptions.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, qData.a);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, chosenOpt, correctAns) {
