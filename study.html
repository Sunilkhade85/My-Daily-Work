<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏫 Class 2 - Navneet Master Game 🌟</title>
    <style>
        body { font-family: 'Comic Sans MS', sans-serif; background: linear-gradient(135deg, #fff1eb 0%, #ace0f9 100%); margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .game-card { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 15px 30px rgba(0,0,0,0.1); width: 100%; max-width: 620px; text-align: center; border: 5px solid #ff7675; }
        h2 { color: #d63031; font-size: 26px; margin: 5px 0; }
        .menu-container { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .menu-btn { display: block; width: 100%; background: #fdcb6e; color: #2d3436; border: none; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 20px; cursor: pointer; box-shadow: 0 5px 0 #e17055; text-align: left; padding-left: 25px; box-sizing: border-box; }
        .menu-btn:hover { background: #ffeaa7; }
        .category-tag { background-color: #6c5ce7; color: white; padding: 6px 20px; border-radius: 20px; font-size: 15px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .score-board { font-size: 20px; color: #e84393; font-weight: bold; margin-bottom: 15px; }
        .question-box { background: #f5f6fa; padding: 25px; border-radius: 20px; font-size: 22px; font-weight: bold; color: #2f3542; margin-bottom: 20px; border: 3px dashed #6c5ce7; line-height: 1.5; }
        .options-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option-btn { background: #74b9ff; color: white; border: none; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 15px; cursor: pointer; box-shadow: 0 4px 0 #0984e3; }
        .option-btn:hover { background: #0984e3; }
        .message { font-size: 22px; font-weight: bold; margin-top: 20px; min-height: 40px; }
        .next-btn, .back-btn { margin-top: 20px; background: #55efc4; color: #2d3436; padding: 12px 35px; font-size: 18px; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 0 #00b894; }
        .back-btn { background: #fab1a0; box-shadow: 0 4px 0 #e17055; margin-right: 10px; }
    </style>
</head>
<body>

<div class="game-card" id="game-box">
    <!-- Home Menu Screen -->
    <h2>🏫 Navneet Smart Workbooks - Class 2 📚</h2>
    <p style="font-size: 16px; color: #636e72; font-weight: bold;">Select your textbook to start the full test 👇</p>
    <div class="menu-container">
        <button class="menu-btn" style="background: #ff7675; color: white; box-shadow: 0 5px 0 #c0392b;" onclick="startSubject('marathi')">📖 मराठी बालभारती व्यवसाय (सर्व भाग १ ते ४)</button>
        <button class="menu-btn" style="background: #54a0ff; color: white; box-shadow: 0 5px 0 #2e86de;" onclick="startSubject('english')">🔤 My English Workbook (All Units 1 to 4)</button>
        <button class="menu-btn" style="background: #2ecc71; color: white; box-shadow: 0 5px 0 #27ae60;" onclick="startSubject('maths')">📐 Mathematics Workbook (All Chapters)</button>
    </div>
</div>

<script>
    let score = 0;
    let currentSubject = "";
    let currentQIdx = 0;
    let currentQuestions = [];

    const repo = {
        marathi: [
            { c: "📖 पाऊस (कविता)", q: "पाऊस आल्यावर डराव डराव असा आवाज कोण करतो?", o: ["बेडूक", "मुलगा", "चिमणी", "मांजर"], a: "बेडूक" },
            { c: "📖 अशी झाली फजिती...", q: "ऊसाच्या शेतात कोणाची फजिती झाली होती?", o: ["भोलोबा अस्वल", "ससा", "कासव", "सिंह"], a: "भोलोbal" },
            { c: "📖 भाज्यांची शाळा", q: "भाज्यांची शाळा या कवितेत कोणाला चीड आली?", o: ["मिरच्यांना", "बटाट्याला", "टोमॅटोला", "वांग्याला"], a: "मिरच्यांना" },
            { c: "📖 कबुतर आणि मुंगी", q: "कबुतराने मुंगीचे प्राण वाचवण्यासाठी पाण्यात काय टाकले?", o: ["पान", "दगड", "दोरी", "काठी"], a: "पान" }
        ],
        english: [
            { c: "🔤 Welcome to School", q: "How should we say hello to our friends?", o: ["With a smile", "Say Sorry", "Cry loudly", "Sit quietly"], a: "With a smile" },
            { c: "🔤 Fruit Salad", q: "Which fruit is sweet, red in color, and used in fruit salad?", o: ["Apple", "Lemon", "Onion", "Potato"], a: "Apple" },
            { c: "🔤 It's Raining...", q: "What do we use when 'It's Raining' outside?", o: ["Umbrella", "Sweater", "Cap", "Fan"], a: "Umbrella" }
        ],
        maths: [
            { c: "📐 Geometrical Shapes", q: "Look at the shape of a brick (वीट). What shape is it?", o: ["Cuboid", "Cone", "Cylinder", "Sphere"], a: "Cuboid" },
            { c: "📐 Number Names", q: "What is the number name for '75'?", o: ["Seventy-five", "Fifty-seven", "Seventy", "Fifty"], a: "Seventy-five" },
            { c: "📐 Units and Tens", q: "The number '36' has how many Tens?", o: ["3 Tens", "6 Tens", "30 Tens", "0 Tens"], a: "3 Tens" }
        ]
    };

    function startSubject(sub) {
        currentSubject = sub;
        currentQIdx = 0;
        currentQuestions = [...repo[sub]];
        renderQuestion();
    }

    function renderQuestion() {
        let qData = currentQuestions[currentQIdx];
        let optionsHTML = "";
        qData.o.forEach(opt => {
            optionsHTML += `<button class="option-btn" onclick="checkAnswer('${opt}', '${qData.a}')">${opt}</button>`;
        });

        let html = `
            <div class="category-tag">${qData.c}</div>
            <div class="score-board">My Stars: ${score} ⭐</div>
            <div class="question-box">${qData.q}</div>
            <div class="options-container">${optionsHTML}</div>
            <div class="message" id="msg"></div>
            <button class="back-btn" onclick="location.reload()">🏡 Main Menu</button>
            <button class="next-btn" id="nxt" style="display:none;" onclick="loadNext()">Next Question ➡️</button>
        `;
        document.getElementById('game-box').innerHTML = html;
    }

    function checkAnswer(chosen, correct) {
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        let m = document.getElementById('msg');
        if(chosen === correct) {
            score++;
            m.style.color = "#00b894";
            m.innerText = "Excellent! 🎉 🌟";
        } else {
            m.style.color = "#d63031";
            m.innerText = "Keep Trying! 👍";
        }
        document.getElementById('nxt').style.display = "inline-block";
    }

    function loadNext() {
        currentQIdx = (currentQIdx + 1) % currentQuestions.length;
        renderQuestion();
    }
</script>
</body>
</html>
