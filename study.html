<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏫 Class 2 Study Game 🌟</title>
    <style>
        body { font-family: 'Comic Sans MS', sans-serif; background: linear-gradient(135deg, #fff1eb 0%, #ace0f9 100%); margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .game-card { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 15px 30px rgba(0,0,0,0.1); width: 100%; max-width: 620px; text-align: center; border: 5px solid #ff7675; }
        h2 { color: #d63031; font-size: 26px; margin: 5px 0; }
        .menu-container { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .menu-btn { background: #fdcb6e; color: #2d3436; border: none; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 20px; cursor: pointer; box-shadow: 0 5px 0 #e17055; text-align: left; padding-left: 25px; }
        .menu-btn:hover { background: #ffeaa7; }
        .category-tag { background-color: #6c5ce7; color: white; padding: 6px 20px; border-radius: 20px; font-size: 16px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .score-board { font-size: 20px; color: #e84393; font-weight: bold; margin-bottom: 15px; }
        .question-box { background: #f5f6fa; padding: 25px; border-radius: 20px; font-size: 22px; font-weight: bold; color: #2f3542; margin-bottom: 20px; border: 3px dashed #6c5ce7; line-height: 1.5; }
        .options-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option-btn { background: #74b9ff; color: white; border: none; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 15px; cursor: pointer; box-shadow: 0 4px 0 #0984e3; }
        .option-btn:hover { background: #0984e3; }
        .message { font-size: 22px; font-weight: bold; margin-top: 20px; min-height: 40px; }
        .next-btn, .back-btn { margin-top: 20px; background: #55efc4; color: #2d3436; padding: 12px 35px; font-size: 18px; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 0 #00b894; }
        .back-btn { background: #fab1a0; box-shadow: 0 4px 0 #e17055; margin-right: 10px; }
    </style>
</head>
<body>

<div class="game-card">
    <!-- Home Menu Screen -->
    <div id="home-screen">
        <h2>🏫 Navneet Smart Workbooks - Class 2 📚</h2>
        <p style="font-size: 16px; color: #636e72; font-weight: bold;">Select textbook chapters to start your test 👇</p>
        <div class="menu-container">
            <button class="menu-btn" style="background: #ff7675; color: white; box-shadow: 0 5px 0 #c0392b;" onclick="startSubject('marathi')">📖 मराठी बालभारती व्यवसाय (भाग १ ते ४)</button>
            <button class="menu-btn" style="background: #54a0ff; color: white; box-shadow: 0 5px 0 #2e86de;" onclick="startSubject('english')">🔤 My English Workbook (Unit 1 to 4)</button>
            <button class="menu-btn" style="background: #2ecc71; color: white; box-shadow: 0 5px 0 #27ae60;" onclick="startSubject('maths')">📐 Mathematics Workbook (All Chapters)</button>
        </div>
    </div>

    <!-- Play Screen -->
    <div id="game-screen" style="display: none;">
        <div id="category" class="category-tag">Subject</div>
        <div class="score-board">My Stars: <span id="score">0</span> ⭐</div>
        <div class="question-box" id="question">Loading...</div>
        <div class="options-container" id="options"></div>
        <div class="message" id="message"></div>
        <button class="back-btn" onclick="goHome()">🏡 Main Menu</button>
        <button class="next-btn" id="next-btn" onclick="loadNextQuestion()">Next Question ➡️</button>
    </div>
</div>

<script>
    let score = 0;
    let currentSubject = "";
    let currentQIdx = 0;
    let currentQuestions = [];

    const repo = {
        marathi: [
            { c: "📖 भाग १: २. पाऊस (कविता)", q: "पाऊस आल्यावर डराव डराव असा आवाज कोण करतो?", o: ["बेडूक", "मुलगा", "चिमणी", "मांजर"], a: "बेडूक" },
            { c: "📖 भाग १: ४. अशी झाली फजिती...", q: "या पाठात कोणाची फजिती झाली होती?", o: ["भोलोबा (अस्वल)", "ससा", "कासव", "सिंह"], a: "भोलोबा (अस्वल)" },
            { c: "📖 भाग २: ९. भाज्यांची शाळा", q: "भाज्यांची शाळा या कवितेत मिरच्या काय करत आहेत?", o: ["मिरच्यांना चीड आली", "मिरच्या नाचत आहेत", "मिरच्या रडत आहेत", "मिरच्या झोपल्या आहेत"], a: "मिरच्यांना चीड आली" },
            { c: "📖 भाग २: कबुतर आणि मुंगी", q: "कबुतराने मुंगीचे प्राण वाचवण्यासाठी पाण्यात काय टाकले?", o: ["पाचोळा / पान", "दगड", "दोरी", "काठी"], a: "पाचोळा / पान" }
        ],
        english: [
            { c: "🔤 UNIT 1: 1.1 Welcome to School", q: "According to chapter 1.1, how should we say hello to our friends?", o: ["Say 'Hello' with a smile", "Say 'Sorry'", "Cry loudly", "Sit quietly"], a: "Say 'Hello' with a smile" },
            { c: "🔤 UNIT 1: 1.7 Fruit Salad", q: "Which fruit is sweet, red in color, and used in fruit salad?", o: ["Apple", "Lemon", "Onion", "Potato"], a: "Apple" },
            { c: "🔤 UNIT 2: 2.1 It's Raining...", q: "What do we use when 'It's Raining' outside?", o: ["Umbrella", "Sweater", "Cap", "Fan"], a: "Umbrella" }
        ],
        maths: [
            { c: "📐 Maths: Let's Understand Geometrical Shapes", q: "Look at the shape of a brick (वीट). What shape is it?", o: ["Cuboid", "Cone", "Cylinder", "Sphere"], a: "Cuboid" },
            { c: "📐 Maths: Units and Tens", q: "The number '54' has how many Tens and Units?", o: ["5 Tens and 4 Units", "4 Tens and 5 Units", "50 Tens and 4 Units", "54 Tens"], a: "5 Tens and 4 Units" },
            { c: "📐 Maths: Face Value and Place Value", q: "What is the PLACE value of 3 in the number '38'?", o: ["30", "8", "3", "80"], a: "30" }
        ]
    };

    function startSubject(sub) {
        currentSubject = sub;
        currentQIdx = 0;
        currentQuestions = [...repo[sub]];
        document.getElementById('home-screen').style.display = "none";
        document.getElementById('game-screen').style.display = "block";
        showQuestion();
    }

    function showQuestion() {
        document.getElementById('message').innerText = "";
        document.getElementById('next-btn').style.display = "none";
        let qData = currentQuestions[currentQIdx];
        document.getElementById('category').innerText = qData.c;
        document.getElementById('question').innerHTML = qData.q;
        let optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = "";
        qData.o.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, qData.a);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, chosenOpt, correctAns) {
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        let msg = document.getElementById('message');
        if(chosenOpt === correctAns) {
            score++; document.getElementById('score').innerText = score;
            msg.style.color = "#00b894"; msg.innerText = "Excellent! 🎉 🌟";
            selectedBtn.style.background = "#00b894";
        } else {
            msg.style.color = "#d63031"; msg.innerText = `Correct Answer is: ${correctAns} 👍`;
            selectedBtn.style.background = "#d63031";
        }
        document.getElementById('next-btn').style.display = "inline-block";
    }

    function loadNextQuestion() {
        currentQIdx = (currentQIdx + 1) % currentQuestions.length;
        showQuestion();
    }

    function goHome() {
        document.getElementById('home-screen').style.display = "block";
        document.getElementById('game-screen').style.display = "none";
    }
</script>
</body>
</html>
