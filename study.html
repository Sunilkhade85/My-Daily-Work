<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏫 Class 2 - Navneet Complete Course Game 🌟</title>
    <style>
        body { font-family: 'Comic Sans MS', sans-serif; background: linear-gradient(135deg, #fff1eb 0%, #ace0f9 100%); margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .game-card { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 15px 30px rgba(0,0,0,0.1); width: 100%; max-width: 680px; text-align: center; border: 5px solid #ff7675; box-sizing: border-box; }
        h2 { color: #d63031; font-size: 26px; margin: 5px 0; text-shadow: 1px 1px 2px #ffeaa7; }
        .menu-container { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .menu-btn { display: block; width: 100%; background: #fdcb6e; color: #2d3436; border: none; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 20px; cursor: pointer; box-shadow: 0 5px 0 #e17055; text-align: left; padding-left: 25px; box-sizing: border-box; }
        .menu-btn:hover { background: #ffeaa7; }
        .lesson-box { background: #fff9db; border: 3px solid #fab005; padding: 20px; border-radius: 20px; text-align: left; font-size: 17px; line-height: 1.6; color: #2b2b2b; margin-bottom: 20px; font-weight: bold; }
        .lesson-title { font-size: 20px; color: #e8590c; font-weight: bold; margin-bottom: 10px; border-bottom: 2px dashed #fab005; padding-bottom: 5px; text-align: center; }
        .category-tag { background-color: #6c5ce7; color: white; padding: 6px 20px; border-radius: 20px; font-size: 15px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .score-board { font-size: 20px; color: #e84393; font-weight: bold; margin-bottom: 15px; }
        .question-box { background: #f5f6fa; padding: 20px; border-radius: 20px; font-size: 20px; font-weight: bold; color: #2f3542; margin-bottom: 20px; border: 3px dashed #6c5ce7; }
        .options-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option-btn { background: #74b9ff; color: white; border: none; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 15px; cursor: pointer; box-shadow: 0 4px 0 #0984e3; }
        .option-btn:hover { background: #0984e3; }
        .message { font-size: 22px; font-weight: bold; margin-top: 20px; min-height: 40px; }
        .next-btn, .back-btn { margin-top: 20px; background: #55efc4; color: #2d3436; padding: 12px 35px; font-size: 18px; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 0 #00b894; }
        .back-btn { background: #fab1a0; box-shadow: 0 4px 0 #e17055; margin-right: 10px; }
        @media (max-width: 480px) { .options-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="game-card" id="game-box">
    <!-- Home Menu Screen -->
    <h2>🏫 Navneet Smart Workbooks - Class 2 📚</h2>
    <p style="font-size: 16px; color: #636e72; font-weight: bold;">Select a textbook to start the full year syllabus 👇</p>
    <div class="menu-container">
        <button class="menu-btn" style="background: #ff7675; color: white; box-shadow: 0 5px 0 #c0392b;" onclick="startSubject('marathi')">📖 मराठी बालभारती व्यवसाय (सर्व धडे १ ते १२ आणि संपूर्ण स्वाध्याय)</button>
        <button class="menu-btn" style="background: #54a0ff; color: white; box-shadow: 0 5px 0 #2e86de;" onclick="startSubject('english')">🔤 My English Workbook (All Units & Textbook Exercises)</button>
        <button class="menu-btn" style="background: #2ecc71; color: white; box-shadow: 0 5px 0 #27ae60;" onclick="startSubject('maths')">📐 Mathematics Workbook (All 10 Full Chapters)</button>
    </div>
</div>

<script>
    let score = 0;
    let currentSubject = "";
    let currentQIdx = 0;
    let currentQuestions = [];

    const repo = {
        marathi: [
            { t: "धडा १: चला शोधूया!", text: "आपल्या आजूबाजूला अनेक प्राणी राहतात. काही जमीनवर तर काही पाण्यात राहतात. पण बेडूक हा जमीन आणि पाणी दोन्हीकडे राहू शकतो.", q: "कोणता प्राणी पाणी आणि जमीन दोन्हीकडे राहू शकतो?", o: ["बेडूक", "मासा", "कुत्रा", "चिमणी"], a: "बेडूक" },
            { t: "धडा २: पाऊस (कविता)", text: "वारा सुटला सुं सुं सुं! वीज चमकली चकचक चक! पाऊस आला धो धो धो, पाणी वाहले सो सो सो! बोटीवर बसला बेडूक, तो ओरडला डराव डराव!", q: "पाऊस आल्यावर डराव डराव आवाज कोण करतो?", o: ["बेडूक", "मुलगा", "चिमणी", "मांजर"], a: "बेडूक" },
            { t: "धडा ३: चतुर हिराबाई", text: "माणिकचा बैल चोरीला गेला. हुशार हिराबाईने बाजारात चोराला पकडले आणि चतुरपणाने आपला बैल परत मिळवला.", q: "हिराबाईने चतुरपणाने बाजारातून काय शोधून काढले?", o: ["चोरीला गेलेला बैल", "गाय", "पैशांची पिशवी", "अंगठी"], a: "चोरीला गेलेला बैल" },
            { t: "धडा ४: अशी झाली फजिती...", text: "भोलोबा अस्वल फिरत फिरत उसाच्या शेतात शिरले. गोड ऊस खाण्यात ते गुंग झाले. शेतकरी काठी घेऊन येताच भोलोबांची फजिती झाली आणि ते पळाले.", q: "उसाच्या शेतात ऊस खाताना कोणाची फजिती झाली?", o: ["भोलोबा अस्वल", "ससा", "कासव", "सिंह"], a: "भोलोबा अस्वल" },
            { t: "धडा ५: फुलपाखरू (कविता)", text: "फुलांच्या दुनियेत फुलपाखरू दंग होते. हळूच बागेत उडते. एका फुलावर बसते आणि त्याचा गोड रस पिते. त्याचे पंख रंगीबेरंगी असतात.", q: "फुलपाखरू फुलांच्या दुनियेत काय करते?", o: ["गोड रस पिते", "गाणे गाते", "झोपून राहते", "रडते"], a: "गोड रस पिते" },
            { t: "धडा ६: मांजराची दहीहंडी", text: "कपाटावर दुधाचे भांडे होते. मांजरांनी विचार केला आणि एकमेकांच्या पाठीवर उभे राहून छान मानवी मनोरा म्हणजेच दहीहंडी तयार केली.", q: "दूध पिण्यासाठी मांजरांनी काय केले?", o: ["मानवी मनोरा केला", "उडी मारली", "काठीने पाडले", "रडले"], a: "मानवी मनोरा केला" },
            { t: "धडा ७: भाज्यांची शाळा", text: "भाज्यांच्या शाळेत मोठी गंमत झाली. वांगोबाने फेटा बांधला, टोमॅटो लाल झाले. पण खेळता खेळता तिखट मिरच्यांना खूप चीड आली आणि त्या रागाने लाल झाल्या.", q: "कवितेत कोणाला खूप चीड आली?", o: ["मिरच्यांना", "बटाट्याला", "टोमॅटोला", "वांग्याला"], a: "मिरच्यांना" },
            { t: "धडा ८: कबुतर आणि मुंगी", text: "नदीच्या पाण्यात एक मुंगी वाहात चालली होती. झाडावर बसलेल्या कबुतराने तिचे प्राण वाचवण्यासाठी पाण्यात एक मोठे झाडाचे पान टाकले.", q: "कबुतराने मुंगीला वाचवायला पाण्यात काय टाकले?", o: ["झाडाचे पान", "दगड", "दोरी", "काठी"], a: "झाडाचे पान" },
            { t: "धडा ९: बैलजोडी (कविता)", text: "सर्जा आणि राजा हे माणिकचे आवडते बैल आहेत. पोळ्याच्या सणाला बैलांना छान आंघोळ घालून सजवले जाते आणि त्यांच्या गळ्यात घुंगुरमाळा बांधतात.", q: "बैलजोडी सणाच्या दिवशी बैलांना काय करतात?", o: ["सजवतात", "कामावर नेतात", "झोपवतात", "मारतात"], a: "सजवतात" },
            { t: "धडा १०: अदितीचे साहस", text: "विमाळवाडी गावात राहणारी अदिती खूप धाडसी होती. एका रात्री तिने घराबाहेर झाडावर चमकणारा एक लहान काजवा कीटक पाहिला.", q: "अदितीला रात्री चमकणारा कोणता कीटक दिसला?", o: ["काजवा", "मुंगी", "बेडूक", "मधुमाशी"], a: "काजवा" },
            { t: "धडा ११: आपले वाचनालय", text: "अतुलच्या घरी एक सुंदर वाचनालय होते. तिथे अनेक प्रकारची नवीन गोष्टींची पुस्तके, मासिके आणि वर्तमानपत्रे एकत्र ठेवली होती, जी सर्व मुले वाचायची.", q: "वाचनालयात आपण काय वाचायला जातो?", o: ["पुस्तके", "मोबाईल", "टीव्ही", "खेळ"], a: "पुस्तके" },
            { t: "धडा १२: कोल्हा आणि करकोचा", text: "स्वार्थी कोल्ह्याने करकोच्याला आपल्या घरी जेवायला बोलावले आणि मुद्दाम एका पसरट थाळीत खीर दिली, जी करकोच्याला आपल्या लांब चोचीने खाता आली नाही.", q: "कोल्ह्याने करकोच्याला जेवायला कशात दिले?", o: ["पसरट थाळीत", "लांब भांड्यात", "ग्लासात", "चमच्यात"], a: "पसरट थाळीत" }
        ],
        english: [
            { t: "1.1 Welcome to School", text: "Welcome back to school, children! School is a happy place. Greet your friends with a big smile. Say 'Hello' nicely with a happy face!", q: "How should we say hello to our friends?", o: ["With a smile", "Say Sorry", "Cry loudly", "Sit quietly"], a: "With a smile" },
            { t: "1.2 Bounce a Ball", text: "Bounce a ball to Willem, bounce a ball to Joe. Roll it to your friend, but bounce it to your teacher! Do not let it go out of the ring.", q: "To whom should you bounce the ball safely?", o: ["Teacher", "Sky", "Window", "Cat"], a: "Teacher" },
            { t: "1.7 Fruit Salad", text: "Fruit salad is healthy and tasty. We use sweet Apples, yellow Bananas, and juicy Grapes. Wash all fruits carefully before cutting.", q: "Which red fruit is sweet and used in fruit salad?", o: ["Apple", "Lemon", "Onion", "Potato"], a: "Apple" },
            { t: "2.1 It's Raining...", text: "Look at the dark clouds! Pitter-patter falls the rain on the ground. We must open our colorful Umbrellas or wear a Raincoat to stay dry.", q: "What do we use when it rains outside?", o: ["Umbrella", "Sweater", "Cap", "Fan"], a: "Umbrella" },
            { t: "2.4 In the Park", text: "Children love to go to the green park. They play on the swings, run on the grass, and have fun sliding down the colorful slide.", q: "What fun activity do children do on a slide?", o: ["Sliding down", "Sleeping", "Writing", "Cooking"], a: "Sliding down" },
            { t: "3.2 Our Calendar", text: "A calendar helps us track days. There are 7 days in a week: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, and Sunday.", q: "How many days are there in a standard week?", o: ["7 days", "12 days", "30 days", "5 days"], a: "7 days" },
            { t: "3.5 Clock and Me", text: "The clock ticks all day long. Tick-tock, tick-tock! The small hand shows hours and the big hand shows minutes. It tells us the correct time.", q: "What does a clock tell us?", o: ["Time", "Weather", "Weight", "Money"], a: "Time" },
            { t: "4.3 Good Habits", text: "Good habits keep us healthy and neat. We should brush our teeth twice a day, trim our nails, and wash hands before eating food.", q: "Which one is considered a GOOD habit?", o: ["Brushing teeth twice", "Waking up late", "Throwing trash", "Biting nails"], a: "Brushing teeth twice" },
